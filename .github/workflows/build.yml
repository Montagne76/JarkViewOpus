name: build

on: [push, workflow_dispatch]

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Configure (x64)
        shell: cmd
        run: |
          "C:\Program Files\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          cmake -B build -A x64

      - name: Build Release
        run: cmake --build build --config Release

      - name: Upload plugin DLL
        uses: actions/upload-artifact@v4
        with:
          name: JarkViewOpus-win64
          path: build/Release/JarkViewOpus.dll
          if-no-files-found: error
